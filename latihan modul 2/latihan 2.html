<!DOCTYPE html>
<html>
<head>
    <title>Data-Type Checks</title>
</head>
<body>
    <form name="myForm" action="" onsubmit=" return validateForm()" method="POST">
        <input type="text" id="telp" name="telp" placeholder="Masukkan nomor telepon">
    </form>

    <script type="text/javascript">
        function validateForm() {
            var telp = document.myForm.username.value;
            if (isNaN(telp)) {
                alert("Telp harus berupa angka");
                return false;
            }   else{
                return true;    
            }
        }
    </script>
</body>
</html>
